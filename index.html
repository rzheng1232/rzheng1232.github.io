const nodePos    = {};  // id → {x, y, angle, depth}
const nodeEls    = {};  // id → DOM element
const edgeEls    = {};  // 'from:to' → SVG line element
const edgeRest   = {};  // 'from:to' → rest length (pixels, set at creation)
const expanded   = new Set();

let wx = 0, wy = 0, wScale = 1;
let dragging = false, dx0 = 0, dy0 = 0, wx0 = 0, wy0 = 0;
let pinchDist = 0;

// node drag state
let dragNode = null, dragStartCX = 0, dragStartCY = 0, dragOriginX = 0, dragOriginY = 0, isDragNode = false;

const viewport = document.getElementById('viewport');
const world    = document.getElementById('world');
const edgesSvg = document.getElementById('edges-svg');

/* ── transform ───────────────────────────────────────────── */
function applyT(animate) {
    world.style.transition = animate ? 'transform .65s cubic-bezier(.25,.46,.45,.94)' : 'none';
    world.style.transform  = `translate(${wx}px,${wy}px) scale(${wScale})`;
}

function centerOn(id) {
    const p = nodePos[id];
    wx = window.innerWidth  / 2 - p.x * wScale;
    wy = window.innerHeight / 2 - p.y * wScale;
    applyT(true);
}

function centerOnGroup(ids) {
    let sx = 0, sy = 0, n = 0;
    ids.forEach(id => { if (nodePos[id]) { sx += nodePos[id].x; sy += nodePos[id].y; n++; } });
    if (!n) return;
    wx = window.innerWidth  / 2 - (sx / n) * wScale;
    wy = window.innerHeight / 2 - (sy / n) * wScale;
    applyT(true);
}

/* ── layout ──────────────────────────────────────────────── */
function fanAngles(n, base) {
    if (base === null) {
        // root: full circle so children spread in all directions
        return Array.from({length: n}, (_, i) => (2 * Math.PI * i / n) - Math.PI / 2);
    }
    if (n === 1) return [base];
    // at least ~75° per child, capped at 200° total so it stays a fan not a full ring
    const s = Math.min(Math.PI * (200 / 180), n * 0.85);
    return Array.from({length: n}, (_, i) => base + (i / (n - 1) - 0.5) * s);
}

function calcChildDist(parentId) {
    const d      = NODES[parentId];
    const n      = d.children.length;
    const childR = Math.max(...d.children.map(c => NODES[c].radius));
    if (n <= 1) return d.radius + childR * 2 + 40;
    const spread     = Math.min(Math.PI * 0.9, (n - 1) * 0.65);
    const deltaAngle = spread / (n - 1);
    // minimum radial distance so adjacent siblings don't touch
    const minNoOverlap = (childR * 2 + 20) / (2 * Math.sin(deltaAngle / 2));
    return Math.max(d.radius + childR + 40, minNoOverlap);
}

/* redraw all edge endpoints from current nodePos */
function refreshEdges() {
    for (const key of Object.keys(edgeEls)) {
        const [from, to] = key.split(':');
        const fp = nodePos[from], tp = nodePos[to];
        if (!fp || !tp) continue;
        const dx  = tp.x - fp.x, dy = tp.y - fp.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const nx  = dx / len, ny = dy / len;
        const ln  = edgeEls[key];
        ln.setAttribute('x1', fp.x + nx * NODES[from].radius);
        ln.setAttribute('y1', fp.y + ny * NODES[from].radius);
        ln.setAttribute('x2', tp.x - nx * NODES[to].radius);
        ln.setAttribute('y2', tp.y - ny * NODES[to].radius);
    }
}

/* apply spring forces for all edges — only moves nodes in movableSet */
function applySpring(movableSet, k = 0.18) {
    for (const key of Object.keys(edgeRest)) {
        const [from, to] = key.split(':');
        const fp = nodePos[from], tp = nodePos[to];
        if (!fp || !tp) continue;
        const dx   = tp.x - fp.x, dy = tp.y - fp.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
        const ext  = dist - edgeRest[key];          // +ve = stretched, -ve = compressed
        if (Math.abs(ext) < 0.5) continue;
        const nx = dx / dist, ny = dy / dist;
        const f  = ext * k;
        if (movableSet.has(to))   { tp.x -= nx * f; tp.y -= ny * f; }
        if (movableSet.has(from)) { fp.x += nx * f; fp.y += ny * f; }
    }
}

/* propagate spring forces during live drag so connected nodes trail along */
function propagateDrag(draggedId) {
    const movable = new Set(Object.keys(nodePos).filter(id => id !== draggedId && id !== 'root'));
    for (let i = 0; i < 10; i++) applySpring(movable, 0.4);
    for (const id of movable) {
        const el = nodeEls[id]; if (!el) continue;
        el.style.left = (nodePos[id].x - NODES[id].radius) + 'px';
        el.style.top  = (nodePos[id].y - NODES[id].radius) + 'px';
    }
}

/* physics sim — movableIds pushed apart by collisions + spring constraints */
let simRaf = null;

function runSim(movableIds, fixedOverride = null) {
    if (simRaf) cancelAnimationFrame(simRaf);

    const PAD       = 16;
    const MAX       = 100;
    let   iter      = 0;
    const movSet    = new Set(movableIds);

    function step() {
        const allIds = Object.keys(nodePos);
        let active   = false;

        // collision repulsion
        for (const aid of movableIds) {
            const a = nodePos[aid]; if (!a) continue;
            let fx = 0, fy = 0;
            for (const bid of allIds) {
                if (aid === bid || !nodePos[bid]) continue;
                const b    = nodePos[bid];
                const dx   = a.x - b.x, dy = a.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
                const minD = NODES[aid].radius + NODES[bid].radius + PAD;
                if (dist >= minD) continue;
                const s = (minD - dist) / dist;
                fx += dx * s; fy += dy * s;
                active = true;
            }
            a.x += fx * 0.5; a.y += fy * 0.5;
        }

        // spring constraints — pull/push nodes toward their rest edge lengths
        applySpring(movSet, 0.12);

        // flush positions
        for (const aid of movableIds) {
            const el = nodeEls[aid]; if (!el) continue;
            el.style.left = (nodePos[aid].x - NODES[aid].radius) + 'px';
            el.style.top  = (nodePos[aid].y - NODES[aid].radius) + 'px';
        }

        refreshEdges();
        iter++;
        if (iter < MAX && (active || iter < 20)) simRaf = requestAnimationFrame(step);
    }

    simRaf = requestAnimationFrame(step);
}

/* ── node DOM ────────────────────────────────────────────── */
function makeNodeEl(id) {
    const d  = NODES[id];
    const sz = d.radius * 2;

    const el = document.createElement('div');
    el.className = `gn gn-${d.type}`;
    el.dataset.id = id;
    el.style.cssText = `width:${sz}px;height:${sz}px;`;
    el.style.setProperty('--nc', d.color);

    // rough.js circle
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', sz);
    svg.setAttribute('height', sz);
    svg.style.cssText = 'position:absolute;top:0;left:0;overflow:visible;pointer-events:none;';
    const rcN = rough.svg(svg);
    const hex = d.color.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    svg.appendChild(rcN.circle(d.radius, d.radius, sz - 8, {
        stroke:      d.color,
        strokeWidth: d.type === 'root' ? 2.8 : d.type === 'page' ? 1.6 : 2.2,
        fill:        `rgba(${r},${g},${b},0.08)`,
        fillStyle:   'solid',
        roughness:   d.type === 'page' ? 1.0 : 1.5,
        hachureGap:  8,
    }));
    el.appendChild(svg);

    // label
    const lbl = document.createElement('div');
    lbl.className = 'gn-lbl';
    lbl.innerHTML = d.label.split('\n').join('<br>');
    if (d.sub) {
        const sub = document.createElement('div');
        sub.className = 'gn-sub';
        sub.textContent = d.sub;
        lbl.appendChild(sub);
    }
    el.appendChild(lbl);

    // hover tooltip for nodes with a description
    if (d.desc) {
        const tip = document.createElement('div');
        tip.className = 'gn-tip';
        tip.textContent = d.desc;
        el.appendChild(tip);
    }

    el.addEventListener('mouseenter', () => el.classList.add('hov'));
    el.addEventListener('mouseleave', () => el.classList.remove('hov'));
    el.addEventListener('mousedown', e => {
        e.stopPropagation();
        if (simRaf) cancelAnimationFrame(simRaf);
        dragNode    = id;
        dragStartCX = e.clientX;
        dragStartCY = e.clientY;
        dragOriginX = nodePos[id].x;
        dragOriginY = nodePos[id].y;
        isDragNode  = false;
        el.style.zIndex = '50';
        document.body.style.cursor = 'grabbing';
    });
    return el;
}

function spawn(id, x, y, angle, depth) {
    nodePos[id] = { x, y, angle, depth };
    const d  = NODES[id];
    const el = makeNodeEl(id);
    el.style.left      = (x - d.radius) + 'px';
    el.style.top       = (y - d.radius) + 'px';
    el.style.transform = 'scale(0)';
    el.style.opacity   = '0';
    world.appendChild(el);
    nodeEls[id] = el;
    requestAnimationFrame(() => {
        el.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s ease';
        el.style.transform  = 'scale(1)';
        el.style.opacity    = '1';
    });
}

function despawn(id, tx, ty) {
    const el = nodeEls[id];
    if (!el) return;
    const r = NODES[id].radius;
    el.style.transition = 'transform .35s ease-in, opacity .3s ease-in, left .35s ease-in, top .35s ease-in';
    el.style.left      = (tx - r) + 'px';
    el.style.top       = (ty - r) + 'px';
    el.style.transform = 'scale(0)';
    el.style.opacity   = '0';
    setTimeout(() => el.remove(), 380);
    delete nodeEls[id];
    delete nodePos[id];
}

/* ── edges ───────────────────────────────────────────────── */
function addEdge(from, to) {
    const fp  = nodePos[from], tp = nodePos[to];
    const key = `${from}:${to}`;
    const dxr = tp.x - fp.x, dyr = tp.y - fp.y;
    edgeRest[key] = Math.sqrt(dxr * dxr + dyr * dyr);

    // offset start/end to circle surfaces so line doesn't poke through nodes
    const dx = tp.x - fp.x, dy = tp.y - fp.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / len, ny = dy / len;
    const x1 = fp.x + nx * NODES[from].radius;
    const y1 = fp.y + ny * NODES[from].radius;
    const x2 = tp.x - nx * NODES[to].radius;
    const y2 = tp.y - ny * NODES[to].radius;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', NODES[to].color);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-linecap', 'round');
    line.style.opacity    = '0';
    line.style.transition = 'opacity .45s ease';
    edgesSvg.appendChild(line);
    edgeEls[key] = line;
    requestAnimationFrame(() => { line.style.opacity = '0.55'; });
}

function removeEdge(from, to) {
    const key  = `${from}:${to}`;
    const line = edgeEls[key];
    if (!line) return;
    line.style.opacity = '0';
    setTimeout(() => line.remove(), 400);
    delete edgeEls[key];
    delete edgeRest[key];
}

/* ── expand / collapse ───────────────────────────────────── */
function expand(id) {
    if (expanded.has(id)) return;
    expanded.add(id);
    const d    = NODES[id];
    const p    = nodePos[id];
    const aa   = fanAngles(d.children.length, p.angle);
    const dd   = calcChildDist(id);
    const newIds = [];
    d.children.forEach((cid, i) => {
        const a = aa[i];
        spawn(cid, p.x + Math.cos(a) * dd, p.y + Math.sin(a) * dd, a, p.depth + 1);
        newIds.push(cid);
        setTimeout(() => addEdge(id, cid), 60);
    });
    runSim(newIds);
}

function collapse(id) {
    if (!expanded.has(id)) return;
    const origin = { x: nodePos[id].x, y: nodePos[id].y };
    const toRemove = [];

    function collect(nid) {
        expanded.delete(nid);
        NODES[nid].children.forEach(cid => {
            removeEdge(nid, cid);
            if (nodeEls[cid]) {
                collect(cid);
                toRemove.push(cid);
            }
        });
    }
    collect(id);
    // remove deepest nodes first (collect is depth-first, so toRemove is leaves-first)
    toRemove.forEach((cid, i) => setTimeout(() => despawn(cid, origin.x, origin.y), i * 22));
}

function onNodeClick(id) {
    const d = NODES[id];
    if (d.children.length > 0) {
        if (expanded.has(id)) {
            collapse(id);
            centerOn(id);
        } else {
            expand(id);
            setTimeout(() => centerOnGroup([id, ...NODES[id].children]), 120);
        }
    } else if (d.url) {
        window.location.href = d.url;
    } else {
        centerOn(id);
    }
}

/* ── pan & zoom ──────────────────────────────────────────── */
viewport.addEventListener('mousedown', e => {
    if (e.target.closest('.gn')) return;
    dragging = true;
    dx0 = e.clientX; dy0 = e.clientY; wx0 = wx; wy0 = wy;
    viewport.style.cursor = 'grabbing';
    world.style.transition = 'none';
});
window.addEventListener('mousemove', e => {
    if (dragging) {
        wx = wx0 + (e.clientX - dx0);
        wy = wy0 + (e.clientY - dy0);
        world.style.transform = `translate(${wx}px,${wy}px) scale(${wScale})`;
    }
    if (dragNode && nodePos[dragNode]) {
        const ddx = e.clientX - dragStartCX;
        const ddy = e.clientY - dragStartCY;
        if (!isDragNode && (ddx * ddx + ddy * ddy) > 36) isDragNode = true;
        if (isDragNode) {
            const p = nodePos[dragNode];
            p.x = dragOriginX + ddx / wScale;
            p.y = dragOriginY + ddy / wScale;
            const el = nodeEls[dragNode];
            if (el) {
                el.style.left = (p.x - NODES[dragNode].radius) + 'px';
                el.style.top  = (p.y - NODES[dragNode].radius) + 'px';
            }
            propagateDrag(dragNode);
            // pushFromDragged(dragNode);
            refreshEdges();
        }
    }
});
window.addEventListener('mouseup', () => {
    dragging = false;
    viewport.style.cursor = '';
    document.body.style.cursor = '';
    if (dragNode) {
        const id = dragNode;
        dragNode = null;
        if (nodeEls[id]) nodeEls[id].style.zIndex = '';
        if (isDragNode) {
            // let everything except root settle after the drop
            const movable = Object.keys(nodePos).filter(nid => nid !== 'root');
            runSim(movable, new Set(['root']));
        } else {
            onNodeClick(id);
        }
    }
});

viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const s  = Math.max(0.25, Math.min(3, wScale * (e.deltaY > 0 ? 0.9 : 1.1)));
    const mx = e.clientX, my = e.clientY;
    wx = mx - (mx - wx) / wScale * s;
    wy = my - (my - wy) / wScale * s;
    wScale = s;
    world.style.transition = 'none';
    world.style.transform  = `translate(${wx}px,${wy}px) scale(${wScale})`;
}, { passive: false });

// touch: one finger = pan, two fingers = pinch-zoom
viewport.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        dragging = true;
        dx0 = e.touches[0].clientX; dy0 = e.touches[0].clientY; wx0 = wx; wy0 = wy;
    } else if (e.touches.length === 2) {
        dragging = false;
        pinchDist = Math.hypot(
            e.touches[1].clientX - e.touches[0].clientX,
            e.touches[1].clientY - e.touches[0].clientY);
    }
}, { passive: true });
viewport.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
        wx = wx0 + (e.touches[0].clientX - dx0);
        wy = wy0 + (e.touches[0].clientY - dy0);
        world.style.transition = 'none';
        world.style.transform  = `translate(${wx}px,${wy}px) scale(${wScale})`;
    } else if (e.touches.length === 2) {
        const d2 = Math.hypot(
            e.touches[1].clientX - e.touches[0].clientX,
            e.touches[1].clientY - e.touches[0].clientY);
        wScale = Math.max(0.25, Math.min(3, wScale * d2 / pinchDist));
        pinchDist = d2;
        world.style.transition = 'none';
        world.style.transform  = `translate(${wx}px,${wy}px) scale(${wScale})`;
    }
}, { passive: false });
viewport.addEventListener('touchend', () => { dragging = false; }, { passive: true });

/* ── init ────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    wScale = 0.9;
    spawn('root', 0, 0, null, 0);
    wx = window.innerWidth  / 2;
    wy = window.innerHeight / 2;
    applyT(false);

    setTimeout(() => {
        expand('root');
        setTimeout(() => centerOnGroup(['root', ...NODES.root.children]), 200);
    }, 300);
});
</script>
</body>
